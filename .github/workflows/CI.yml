name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: [28.1, 29.1, 30.1, 31.1, snapshot]
        auctex: [yes, no]
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs }}

      - name: Install dependencies
        run: |
          emacs -Q --batch \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(unless (package-installed-p 'compat) (package-install 'compat))"
          if [ "${{ matrix.auctex }}" = yes ]; then
            emacs -Q --batch \
              --eval "(package-initialize)" \
              --eval "(unless (package-installed-p 'auctex) (package-install 'auctex))"
          fi

      - name: Run tests
        env:
          WITH_AUCTEX: ${{ matrix.auctex }}
        run: ./run-tests.sh
