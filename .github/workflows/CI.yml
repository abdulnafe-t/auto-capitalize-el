name: CI

on:
  push:
    paths-ignore:
      - '*.org'
      - '*.md'
  pull_request:
    paths-ignore:
      - '*.org'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs: [28.1, 29.1, 30.1, 31.1, snapshot]
        auctex: [yes, no]
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs }}

      - name: Install dependencies
        run: |
          emacs -Q --batch \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(unless (package-installed-p 'compat '(31 0)) (package-install 'compat))"
          if [ "${{ matrix.auctex }}" = yes ]; then
            emacs -Q --batch \
              --eval "(package-initialize)" \
              --eval "(unless (package-installed-p 'auctex) (package-install 'auctex))"
          fi

      - name: Compile
        run: |
          emacs -Q --batch -L . \
            --eval "(setq byte-compile-error-on-warn t)" \
            --eval "(package-initialize)" \
            -f batch-byte-compile \
            *.el

      - name: Run tests
        env:
          WITH_AUCTEX: ${{ matrix.auctex }}
        run: ./run-tests.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: 31.1

      - name: Install package-lint
        run: |
          emacs -Q --batch \
            --eval "(progn (package-initialize) (package-refresh-contents) (unless (package-installed-p 'package-lint) (package-install 'package-lint)))"

      - name: Lint (package-lint)
        run: |
          emacs -Q --batch -L . \
            --eval "(package-initialize)" \
            --eval '(setq package-lint-main-file "auto-capitalize.el")' \
            -f package-lint-batch-and-exit \
            *.el

      - name: Lint (checkdoc)
        run: |
          emacs -Q --batch -L . \
            --eval "(progn (require 'checkdoc) (setq sentence-end-double-space nil) \
                    (dolist (f command-line-args-left) \
                      (find-file f) (checkdoc-batch)))" \
            *.el
